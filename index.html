<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmissão da Galera</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1016; --muted:#9a9cb3; --accent:#7c5cff; --accent2:#ff6b9d; --line:#2c2f40; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #e9e9f2; font-family: "Poppins", "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #2a1f5c 0, var(--bg) 62%); padding: 24px; }
  main { text-align: center; max-width: 420px; width: 100%; }
  .logo { position: relative; width: 132px; height: 132px; margin: 0 auto 26px; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); animation: spin 1.1s linear infinite; }
  .ring.r2 { inset: 12px; border-top-color: var(--accent2); border-right-color: transparent; border-left-color: var(--accent2); animation-duration: 1.7s; animation-direction: reverse; }
  .dog { position: absolute; inset: 26px; border-radius: 22px; background: linear-gradient(135deg, #9a7cff, #6a48f5); display: grid; place-items: center; box-shadow: 0 8px 30px rgba(124,92,255,.45); animation: spin 2.4s linear infinite; }
  .dog svg { width: 64%; height: 64%; color: #fff; }
  h1 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: .3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: .92rem; min-height: 2.6em; }
  .bar { width: 240px; max-width: 100%; height: 6px; border-radius: 9px; background: #262838; overflow: hidden; margin: 0 auto 14px; }
  .bar span { display: block; height: 100%; width: 8%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 9px; transition: width .6s ease; }
  .steps { list-style: none; margin: 0 auto; padding: 0; display: inline-flex; flex-direction: column; gap: 6px; text-align: left; font-size: .85rem; color: var(--muted); }
  .steps li::before { content: "○"; display: inline-block; width: 1.4em; color: #5a5d75; }
  .steps li.on { color: #e9e9f2; } .steps li.on::before { content: "◔"; color: var(--accent); }
  .steps li.done { color: #8fe0c0; } .steps li.done::before { content: "✓"; color: #2ecc9a; }
  .again { display: none; margin-top: 18px; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .again.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring, .dog { animation-duration: 6s; } }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <div class="ring"></div><div class="ring r2"></div>
    <div class="dog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 5.6h7.6c1.6 0 3 1.3 3 3v5.4c0 3.3-3 5.6-6.8 5.6s-6.8-2.3-6.8-5.6V8.6c0-1.7 1.4-3 3-3z"/><path d="M5.3 6.6C3.4 6.8 2.4 9.2 2.9 12.2c.3 1.8 1.1 3 2.4 3.4M18.7 6.6c1.9.2 2.9 2.6 2.4 5.6-.3 1.8-1.1 3-2.4 3.4"/><path d="M12 15.9v1.2M9.9 17.6c.7.6 1.4.9 2.1.9s1.4-.3 2.1-.9"/><circle cx="9.2" cy="11.2" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.8" cy="11.2" r="1.1" fill="currentColor" stroke="none"/><ellipse cx="12" cy="14.7" rx="1.7" ry="1.15" fill="currentColor" stroke="none"/></svg>
    </div>
  </div>
  <h1>Transmissão da Galera</h1>
  <p class="sub" id="sub" role="status" aria-live="polite">Ligando os servidores…</p>
  <div class="bar"><span id="bar"></span></div>
  <ul class="steps">
    <li id="s1" class="on">Chamando o servidor</li>
    <li id="s2">Acordando o servidor (pode levar até 1 minuto)</li>
    <li id="s3">Abrindo o app</li>
  </ul>
  <div><a class="again" id="again" href="#">Abrir mesmo assim</a></div>
</main>
<script>
  // Página de entrada: o servidor grátis do Render dorme sem uso. Aqui a gente acorda ele
  // mostrando o cachorro girando e, quando responde, abre o app sozinho.
  const APP = 'https://transmissao-da-galera.onrender.com';
  const convite = (new URLSearchParams(location.search).get('convite') || '').replace(/[^A-Za-z0-9-]/g, '');
  const destino = APP + (convite ? '/convite/' + convite : '/');
  const $ = id => document.getElementById(id);
  const t0 = Date.now(), sleep = ms => new Promise(r => setTimeout(r, ms));
  const passo = n => { for (const i of [1, 2, 3]) $('s' + i).className = i < n ? 'done' : i === n ? 'on' : ''; };
  $('again').href = destino;

  async function acordou() {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 20000);
    try {
      const r = await fetch(APP + '/api/config?x=' + Date.now(), { signal: c.signal, cache: 'no-store' });
      const j = await r.json();
      return !!(j && 'maxMembers' in j);
    } catch { return false; } finally { clearTimeout(t); }
  }
  async function ir() {
    passo(3); $('bar').style.width = '100%'; $('sub').textContent = 'Tudo pronto! Abrindo…';
    await sleep(700); location.replace(destino);
  }
  (async () => {
    let tentativas = 0;
    while (true) {
      const seg = (Date.now() - t0) / 1000;
      if (await acordou()) return ir();
      tentativas++;
      if (tentativas === 1) { passo(2); $('sub').textContent = 'O servidor estava dormindo. Estamos acordando ele…'; }
      $('bar').style.width = Math.min(92, 8 + seg * 1.1) + '%';
      if (seg > 150) { $('sub').textContent = 'Está demorando mais que o normal.'; $('again').classList.add('show'); if (seg > 240) return location.replace(destino); }
      await sleep(2500);
    }
  })();
</script>
</body>
</html>
